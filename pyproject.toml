[project]
name = "secure-secrets-vault"
version = "0.1.0"
description = "CLI-менеджер секретов с локальным зашифрованным хранилищем (AES-256-GCM + Argon2id)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13.9",
    "pyperclip>=1.9",
]

[project.scripts]
vault = "secure_secrets_vault.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "types-pyperclip>=1.11.0.20260508",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_secrets_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
